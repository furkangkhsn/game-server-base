name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep in lockstep with rust-toolchain.toml and `rust-version` in
  # Cargo.toml. MSRV == pinned toolchain (bevy_ecs 0.19.1 declares
  # rust-version 1.95.0), so a separate MSRV build job would only repeat
  # the clippy/test jobs on the same compiler.
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # No protoc install step: the proto build scripts (gsb-protocol,
      # gsb-kit, gsb-demo) hand prost-build the `protoc-bin-vendored` binary, so
      # the build needs neither a system protoc nor `PROTOC`.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The gsb-lint policy scan runs inside every crate's build script,
      # so this job also enforces the banned-pattern list.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # rustdoc stays warning-free: a broken or private intra-doc link is a
  # dead reference in the API docs, so it fails the build like a clippy
  # warning does. `--no-deps`: only this workspace's docs are judged.
  doc:
    name: rustdoc
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  # The game-agnostic core (docs/GAME-MODULE.md §4.2): gsb-server with NO
  # game feature must still build — the structural proof that the server
  # core names no game. The loadgen and the example client require the
  # demo (`required-features`), so they are skipped here; the gsb-server
  # binary builds and refuses every `game` name at startup. Each hosted
  # game's feature must also build ALONE (no demo beside it): the proof
  # that a game module leans on nothing another game's feature brings
  # (the job keeps its name: it may be a required status check).
  no-game:
    name: no-game build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p gsb-server --lib --no-default-features
      - run: cargo clippy -p gsb-server --lib --bins --no-default-features -- -D warnings
      - run: cargo build -p gsb-server --lib --no-default-features --features game-arena
      - run: cargo clippy -p gsb-server --lib --bins --no-default-features --features game-arena -- -D warnings
      - run: cargo build -p gsb-server --lib --no-default-features --features game-mmo
      - run: cargo clippy -p gsb-server --lib --bins --no-default-features --features game-mmo -- -D warnings
      - run: cargo build -p gsb-server --lib --no-default-features --features game-war
      - run: cargo clippy -p gsb-server --lib --bins --no-default-features --features game-war -- -D warnings

  # The OTLP push exporter (docs/OPS.md §6) is off by default, so no
  # other job compiles it: build and lint the workspace with it on and
  # run its own tests (the core's mapping/hand-off/push units, the
  # server's config-to-push e2e), so the feature cannot rot unseen. The
  # builds without `prometheus` are the no-game job's (it is a default
  # feature, so every `--no-default-features` build there drops it).
  otlp:
    name: otlp exporter
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p gsb-server --features otlp
      - run: cargo clippy --workspace --all-targets --features gsb-server/otlp -- -D warnings
      - run: cargo test -p gsb-core --features otlp --lib
      - run: cargo test -p gsb-server --features otlp --test otlp_export

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # No protoc install step — see the clippy job.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      # Loopback-only (TCP/UDP/QUIC/WS on 127.0.0.1, ephemeral ports); no
      # outbound network. Several suites assert wall-clock tick rates and
      # timeouts (e.g. loadgen_smoke expects 20-40 Hz in a debug build).
      - run: cargo test --workspace

  # RFC 6455 conformance of the hand-written WS door (docs/HANDOFF "WS uyum
  # kapısı"). The Autobahn fuzzing client needs an ECHO server, so it drives
  # examples/ws_autobahn.rs: the production door with the opaque message
  # mapping (arbitrary binary payloads echo back instead of failing the game
  # envelope). The case selection, every exclusion's reason (text is refused
  # by the wire contract; compression is not offered) and the pass rule live
  # in .github/autobahn/autobahn.py, which also judges the report.
  autobahn:
    name: autobahn (RFC 6455)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p gsb-net --example ws_autobahn
      - name: Start the WS echo harness
        run: |
          mkdir -p autobahn
          nohup ./target/release/examples/ws_autobahn 127.0.0.1:9001 \
            > autobahn/harness.log 2>&1 &
          for _ in $(seq 1 50); do
            (exec 3<>/dev/tcp/127.0.0.1/9001) 2>/dev/null && exit 0
            sleep 0.2
          done
          echo "harness did not start listening"; cat autobahn/harness.log; exit 1
      - name: Run the Autobahn fuzzing client
        run: |
          python3 .github/autobahn/autobahn.py spec autobahn/fuzzingclient.json
          docker run --rm --network host \
            -v "$PWD/autobahn:/autobahn" \
            crossbario/autobahn-testsuite:25.10.1 \
            wstest -m fuzzingclient -s /autobahn/fuzzingclient.json
      - name: Judge the report
        run: python3 .github/autobahn/autobahn.py check autobahn/reports/index.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autobahn-report
          path: autobahn/
          if-no-files-found: warn
