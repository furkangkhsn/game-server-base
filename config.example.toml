# gsb server configuration.
# Copy to `config.toml` next to where you run the binary
# (`gsb-server config.toml`), or point the binary at it: `gsb-server path.toml`.
# Missing keys fall back to the defaults shown here.

# The game this server hosts (docs/GAME-MODULE.md): one of the games
# compiled into the build (cargo features). "demo" (the default) is the 2D
# demo; its settings are the flat keys below (visibility, topology,
# shard_count, aoi_cell_size, ...), all commented out at their defaults so
# the file stays valid for "arena" and "mmo" too (they refuse the demo's
# keys when written). An unknown name refuses startup and lists the
# compiled-in games.
game = "demo"

# Socket address to bind.
bind = "0.0.0.0:7777"

# Transport: "tcp" (length-prefixed frames over per-connection sockets,
# the default) or "udp" (rUDP: one shared socket, cookie-handshake
# sessions, a reliable control band + a loss-tolerant game band,
# datagram-level idle sweep; DESIGN §6). The whole actor layer is
# transport-agnostic — this only changes who runs the pumps.
# With both TLS keys set below, "tcp" serves TCP-over-TLS (rustls).
transport = "tcp"

# TLS (docs/SECURITY.md §2): paths to the server certificate chain (PEM,
# leaf first) and its private key (PEM). BOTH empty (the default) =
# plaintext TCP, exactly as always. BOTH set = every "tcp" connection is
# upgraded with a rustls handshake (capped at 10 s; a slow or hostile
# handshake is dropped). Setting ONE without the other REFUSES STARTUP —
# no silent half-configured fallback. Either key together with
# transport = "udp" also refuses startup: rUDP is experimental and takes
# no TLS. The framing above the socket is identical either way — clients
# pick plaintext or TLS at connect time.
#tls_cert = "/etc/gsb/cert.pem"
#tls_key = "/etc/gsb/key.pem"

# MULTIPLE LISTENERS ([[listeners]]): independent doors that serve the SAME
# rooms/map simultaneously — e.g. a TLS door for public clients next to a
# plain-TCP door for a LAN build, a QUIC or rUDP door beside both, or a
# WebSocket door for browser-adjacent clients. Every accepted client joins
# the same registry, the same rooms, and shares one connection-id sequence;
# which door a client used is invisible to rooms.
#
#   [[listeners]]
#   transport = "tcp" | "tls" | "udp" | "quic" | "ws"   # required
#   bind      = "0.0.0.0:7777"            # required
#   tls_cert  = "/etc/gsb/cert.pem"       # "tls"/"quic" entries ONLY (with tls_key)
#   tls_key   = "/etc/gsb/key.pem"        # "tls"/"quic" entries ONLY (with tls_cert)
#
# Example: an encrypted public door plus a plaintext LAN door:
#   [[listeners]]
#   transport = "tls"
#   bind = "0.0.0.0:7777"
#   tls_cert = "/etc/gsb/cert.pem"
#   tls_key = "/etc/gsb/key.pem"
#
#   [[listeners]]
#   transport = "tcp"
#   bind = "192.168.1.10:7777"
#
# Rules:
# - When `[[listeners]]` is ABSENT (the default), exactly ONE listener is
#   derived from the scalar keys above (transport/bind/tls_cert/tls_key)
#   with identical behavior — existing configs keep working unchanged.
#   The legacy scalar grammar stays tcp/udp(+tls files) only: "quic" and
#   "ws" are array-only spellings.
# - When PRESENT and non-empty, the array WINS and the scalar transport
#   keys are ignored (a warning is logged at startup if any of them was
#   also set).
# - An explicitly EMPTY array refuses startup.
# - Duplicate concrete bind addresses refuse startup. Port 0 is exempt:
#   each ":0" entry asks the OS for its own free port (ephemeral doors).
# - "tls" and "quic" require BOTH tls_cert and tls_key on the entry (QUIC
#   is TLS 1.3 underneath and loads the same identity); "tcp"/"udp"/"ws"
#   entries take none. A half-set entry refuses startup with the error
#   naming it. A "udp" entry honors the global udp_* knobs below
#   (per-listener overrides are deliberately not supported: capacities,
#   budgets and idle windows are policies of the one actor stack, not of
#   a socket); each udp entry owns its own socket and demux. Frame limits,
#   channel capacities and idle windows apply to every door alike; a WS
#   message ceiling derives from max_frame_bytes (+ its 4-byte prefix).

# Accept backlog of every TCP-based listening socket: the "tcp", "tls"
# and "ws" doors (scalar or [[listeners]]) and the ops HTTP surface
# (http_listen). It is the queue of connections the kernel completed and
# the server has not accepted yet; a join storm past it loses SYNs
# (Linux: TcpExtListenOverflows) and those clients retry a second later.
# The default, 128, is the queue tokio's own bind gives — every door had
# it before this key existed. The kernel caps the value at somaxconn
# (Linux net.core.somaxconn, 4096 by default); a larger value is capped,
# not refused. 1..=2147483647; 0 refuses startup. UDP doors (rUDP, QUIC)
# have no accept queue and ignore it. Server-wide only: [rooms.<id>]
# refuses it, and written inside a [[listeners]] entry it has no effect.
#listen_backlog = 128


# rUDP only: maximum outbound datagram size in bytes. 1472 = typical
# Ethernet MTU minus IP/UDP headers. A game-band frame over it (a large
# snapshot) is fragmented into up to 16 datagrams and reassembled by the
# client; a frame past 16 fragments is dropped, counted, and warned once
# per session. Control frames are never fragmented. Ignored when
# transport = "tcp".
udp_max_datagram_bytes = 1472

# rUDP only: the cookie key of the handshake's anti-amplification
# check, as 32 hex characters (16 bytes). Omitted (the default) = the
# server draws 16 bytes from the OS entropy source at bind time
# (getrandom(2) on Linux, BCryptGenRandom on Windows). Supplying a key
# makes the handshake reproducible/auditable and is the escape hatch
# for a platform where the entropy source cannot be read. If the
# entropy draw fails and no key is configured, the server REFUSES TO
# START (a predictable key would let an off-path attacker who narrows
# the server's start time forge proofs and allocate sessions for
# spoofed addresses — inverting the property; a warning is not a
# security posture). Ignored when transport = "tcp".
#udp_cookie_key = "0123456789abcdef0123456789abcdef"

# Global tick rate (ticks per second). One ticker task feeds all rooms over
# a broadcast channel. A room may run slower, at any rate that divides this
# one (e.g. global 60 → a room at 15 steps every 4th tick).
tick_hz = 30.0

# Rooms pre-created at startup (ids 1..=room_count), all at the global rate
# (unless a room's own [rooms.<id>] section below says otherwise).
room_count = 1

# Maximum frame body size in bytes (length-prefix guard; 1 MiB default).
max_frame_bytes = 1048576

# Room control channel capacity (join/leave/shutdown; low frequency).
room_control = 128

# Per-connection action channel capacity (inputs buffered until the room's
# next tick). If a connection's channel is full, its NEWEST input is
# dropped on the sender side (the connection actor's try_send fails) and
# the drop is counted in that connection's metrics sample
# (actions_dropped / actions_dropped_top). The room itself never drops an
# action it pulled: its READ phase is a bounded pull (per-connection
# per-tick budget + room pull budget; DESIGN §4). Must be >= 1: 0 refuses
# startup (a zero-capacity channel has no meaning).
conn_action = 256

# Per-connection inbound channel capacity (frames from the reader pump).
conn_inbox = 1024

# Per-connection outbound channel capacity (batches from room fan-out).
conn_out = 256

# Session idle window, in seconds. A connection that sends no client frame
# (any frame counts, heartbeat included) for this long is closed by the
# server with an ERROR code 9 frame right before the socket closes. This is
# the half-open TCP guardrail (cable pulled / power lost: no FIN/RST ever
# arrives). The clock lives in the reader pump's read deadline — no extra
# task or message per connection (DESIGN §3). 0 disables the timeout.
idle_timeout_secs = 30.0

# Session write-stall window, in seconds: the other half of the socket.
# A connection whose socket has accepted not one BYTE for this long —
# while the server had something to write — is closed by the server,
# through the same teardown as the idle window above. The two are
# a pair: inbound silence cannot see a peer that keeps its connection open
# and simply stops READING. Such a peer's receive window closes, the
# writer pump parks inside its socket write, the outbound channel stays
# full (never closed), the room drops a frame every tick, and the session
# holds its room slot and registry row while receiving nothing.
#
# The bound is on PROGRESS, not age — and on BYTES, not frames: every byte
# the socket accepts restarts the window, even in the middle of a frame
# that takes longer than the window to drain, so a client that is merely
# BEHIND — still draining, just slowly — is tolerated exactly as before
# (its dropped snapshots keep being counted). Ten seconds of a socket
# accepting not one byte is not slowness. (Kernel caveat: Linux wakes a
# writer blocked on a full send buffer only after roughly a third of it
# has drained, so a reader slower than about buffer / (3 x window) still
# looks silent between wake-ups.) The clock lives in the writer pump's
# write deadline — no extra task or message per connection. 0 disables
# the check. Every close it makes is counted:
# gsb_net_server_closes_total{reason="write_stall"} (DESIGN §12).
write_stall_secs = 10.0

# Per-room membership cap. A join into a full room is answered with a
# gentle ERROR code 8 (the connection stays alive; it can join another
# room). Default 10 000 = the measured single-room wall (p50 step time
# crosses the 33.3 ms budget between 9k and 10k players; DESIGN §14.3).
# 0 removes the cap; omitting the key keeps the default.
max_players = 10000

# Server-wide connection (session) cap, enforced in the registry. A
# connection accepted at/over the cap is answered with ERROR code 9 and
# closed immediately. Default 100 000 = the design target kept as a
# guardrail. 0 removes the cap.
max_connections = 100000

# Warn (log) when a room group's snapshot payload exceeds this many bytes.
# The default sits just under a typical Ethernet MTU: on rUDP a larger
# payload is fragmented (a lost fragment loses the whole frame), so the
# warning — emitted once per snapshot group, not once per tick — is a
# bandwidth/fragmentation signal to split the group (AOI) or lower its
# emission rate.
max_snapshot_bytes = 1400

# Keep-alive rate for unchanged snapshot groups, in Hz. When nothing
# changed the room ships nothing — but each group re-sends its last cached
# snapshot at this rate, so a client that lost its last packet cannot stay
# stale forever. <= 0 disables. Default 1 Hz.
#
# Must be <= tick_hz: the room cannot keep alive faster than it ticks. A
# higher value is rejected at room creation (KeepaliveRate); a keep-alive
# clamped to every step would defeat the silence-when-unchanged gain.
keepalive_hz = 1.0

# INPUT-IDLE CEILING (saniye) — KAPALI varsayılan.
#
# AFK bir OYUN kararıdır: MMO kasabasında kıpırdamadan durmak meşru
# oynayıştır, MOBA'da 30 saniye hareketsizlik bot devri tetikleyicisidir.
# Bu yüzden base yalnızca SİNYALİ koşulsuz yayınlar (oyun mantığı her
# tick hook'unda `ctx.since_input(player)` ile okur) ve politikayı oyuna
# bırakır. Bu anahtar politikanın kendisi değil, operatörün kapasite
# emniyet supabıdır.
#
# Açıldığında: son AKSİYON TAŞIYAN karesi bu kadar eski olan bir üye,
# odanın olağan kopma yoluna verilir — `GameLogic::on_disconnect`
# çağrılır ve park / AI devri / despawn kararını OYUN verir; base
# kendiliğinden hiçbir şeyi despawn etmez.
#
# "Aksiyon taşıyan" YAPISAL tanımlıdır: bağlantı aktörünün odaya
# `Action` olarak ilettiği her kare (kayıtlı her oyun-bandı opcode'u +
# base-bandı RPC istek zarfı). HEARTBEAT bağlantı aktöründe yanıtlanır,
# odaya hiç ulaşmaz — yani nabız oturumu canlı tutar ama bu saati
# SIFIRLAMAZ. Park edilmiş (detached) ya da bot beslenen satırlar bu
# tavana hiç tabi değildir.
#
# Anahtarı hiç yazmamak (varsayılan) ve 0 yazmak aynı anlama gelir: KAPALI.
# max_idle_input_secs = 300

# AFK ACTION — tavan dolunca ne olur. Varsayılan "leave_room". BACKLOG E6,
# docs/RECONNECT.md §16.1.
#
# İkisi de önce üyeyi oyunun on_disconnect'ine verir (park / AI devri /
# despawn — oyunun kararı):
#
#   "leave_room"  = üyelik biter, SOKET AÇIK kalır; istemciye hiçbir şey
#                   gitmez, yeniden katılabilir (bugünkü davranış)
#   "disconnect"  = bağlantı da kapanır: istemciye en-iyi-çaba ERROR 9
#                   ("input idle: …"), sonra kapanış; server_closes
#                   {reason="idle_input"} sayılır. Park edilmiş varlık
#                   aynı kimlikle yeniden bağlanınca geri alınır.
#
# Yazılmazsa oyunun varsayılanı (GameModule::afk_action; repodaki oyunlar
# vermez → "leave_room"). max_idle_input_secs yoksa etkisizdir. Bir oda
# kendi değerini [rooms.<id>] ile alabilir (aşağıda).
# afk_action = "disconnect"

# DETACH-HOLD CEILING (saniye) — varsayılan 600 (10 dk). docs/RECONNECT.md §17.
#
# Kopan bir oyuncunun karakterini oyunun `may_release` vetosu ("savaşta,
# çıkamaz") en fazla bu kadar tutabilir; süre KOPMA anından ölçülür.
# Tavanda hâlâ duran veto ezilir, bekletme politikanın sonuna (bot devri
# ya da despawn) biter ve oda bir kez uyarır. Tavan yalnız VETOYU ezer:
# oyunun grace'ini (ör. MMO'nun çıkış sayacı) asla kısaltmaz. Barındırılan
# her oyunun odalarına (sharded oyunda her shard'a) aynen gider; bir oda
# kendi değerini [rooms.<id>] ile alabilir (aşağıda).
#
#   yazılmazsa = 600 (çekirdeğin varsayılanı)
#   N          = N saniye (kesir olabilir: 2.5)
#   0          = uzatma yok: veto ilk sorulduğunda ezilir (KAPALI DEĞİL —
#                "0 = kapalı" bir yazım hatasını sınırsız kilide çevirirdi)
#   "off"      = tavan yok: veto durdukça tutar (yalnız güvenilir oyun için)
#
# Negatif sayı ya da başka bir kelime başlatmada hatadır.
# max_detach_hold_secs = 600

# INPUT RATE LIMIT (aksiyon/sn) — varsayılan KAPALI. docs/SECURITY.md §3.4,
# BACKLOG E1.
#
# Bağlantı başına token bucket: saniyede input_rate_hz aksiyon, bir anda en
# çok input_burst. Yalnız geçerli OYUN girdisi ölçülür (kayıtlı oyun-bandı
# opcode'ları); HEARTBEAT/JOIN/LEAVE ve RPC istekleri ölçülmez. Aşan girdi
# bağlantı aktöründe DÜŞER (odaya hiç girmez), input_rate_limited olarak
# sayılır (gsb_net_input_rate_limited_total; OTLP'de _total'sız) ve ihlal
# DEĞİLDİR — bağlantı kopmaz. Sayı oynanış parametresidir: oyunun dürüst
# temposunun üstünde, payla seçin; hızlı ama dürüst bir istemciyi kesmesin.
#
#   yazılmazsa  = oyunun varsayılanı (GameModule::input_rate; repodaki
#                 oyunlar vermez → KAPALI)
#   0           = KAPALI (oyunun varsayılanının da üstünde)
#   N           = saniyede N aksiyon
#
# input_burst yazılmazsa bir saniyelik (= input_rate_hz). Yalnız aynı
# tabloda input_rate_hz > 0 ile birlikte: tek başına, input_rate_hz = 0'ın
# yanında ya da 0 olarak başlatmayı durdurur. Bir oda kendi değerini
# [rooms.<id>] ile alabilir (aşağıda).
# input_rate_hz = 60
# input_burst = 30

# ROOM SELECTION: three orthogonal axes (docs/ROADMAP.md, P2
# "Konfigürasyon düzeltmesi" — Faz A):
#
#   topology      = "single" | "sharded"
#       Who computes the world, as how many authoritative pieces.
#       "single": one room actor over one world (the default).
#       "sharded": the map is cut into a shard_count grid; each shard is
#       its own actor + world with entity migration across the seams.
#   visibility    = "all" | "spatial" | "team" | "pvs"
#       Who sees whom within the world (the snapshot group key):
#       all     - everyone sees the whole world (baseline)
#       spatial - spatial AOI, 3x3 cell block (see aoi_cell_size)
#       team    - team fog of war, 2 groups (see team_vision_radius)
#       pvs     - per-map-segment PVS, static visibility table
#   communication = "always-full" | "delta"
#       How snapshots are packaged for clients: a full frame every time,
#       or deltas converging on the keepalive full.
#
# DERIVATION (when the new keys are omitted) from the legacy spelling:
#
#   visibility = "all"     →  single  x all      x always-full
#   visibility = "spatial" →  single  x spatial  x delta*
#   visibility = "team"    →  single  x team     x always-full
#   visibility = "pvs"     →  single  x pvs      x always-full
#   visibility = "sharded" →  sharded x all      x always-full
#
#   * describes what the spatial room already does INTERNALLY (per-cell
#     diffing); it is not a client-facing delta request.
#
# PRECEDENCE: an explicit topology / communication key WINS over its
# derived cell. Setting both sides of a contradiction (e.g. legacy
# visibility = "sharded" next to topology = "single") logs a startup warn
# naming which side took effect — behavior never changes silently.
#
# SUPPORTED TODAY (everything else REFUSES STARTUP, with an error naming
# the roadmap phase/document that will deliver it):
#
#   single  x all     x always-full   (OpenRoom)
#   single  x spatial x delta         (AoiRoom — delta is its ONLY
#                                      packaging, so the derived spelling
#                                      and an explicit "delta" resolve to
#                                      the same room)
#   single  x team    x always-full   (TeamRoom)
#   single  x pvs     x always-full   (SectorRoom)
#   sharded x all     x always-full   (ShardedRoom grid)
#   sharded x spatial x delta         (ShardedSpatialRoom grid — the Faz B
#                                      composite: the same N-actor
#                                      topology, each shard broadcasting
#                                      cell-grouped deltas over its own
#                                      region)
#
# In other words the communication axis is DETERMINED by the visibility
# axis today: spatial rooms speak delta and only delta, every other room
# speaks full frames and only full frames. Omit the key and the right value
# is derived; write it and it must agree with what the room speaks.
#
# Rejected combinations:
#   communication = "delta" with visibility = "all"/"team"/"pvs" -
#     client-facing delta frames exist only in the spatial rooms today
#     (the rest wait for the common DeltaSnapshotCodec on ROADMAP).
#   communication = "always-full" with visibility = "spatial" - the mirror
#     of the above: no spatial room has a full-frame mode (their fulls are
#     the keepalive / late-join recovery path, not a wire setting), so the
#     request names packaging nothing serves. Omit the key instead.
#   topology = "sharded" + visibility = "team"/"pvs" - cross-shard interest
#     needs a subscription layer that does not exist yet (shard locality;
#     docs/CROSS-SHARD.md §4).
#visibility = "all"
#topology = "single"
#communication = "always-full"

# Number of shards (used only when the RESOLVED topology is "sharded" —
# via legacy visibility = "sharded" OR explicit topology = "sharded"). The
# room's map is cut into a grid of this many cells (1..=256; the grid picks
# the shape closest to square). Each shard is one actor that owns its world
# slice; entities migrate between neighboring shards when they cross a
# seam. See docs/DESIGN.md §8.2.
#shard_count = 4

# World units per AOI cell edge (used only when visibility = "spatial").
#aoi_cell_size = 20.0

# World units an enemy must be within to be visible to a team
# (used only when visibility = "team").
#team_vision_radius = 25.0

# Half-size of the square map entities spawn on (all demo rooms; the demo
# map has no walls, so the map is as big as the game wants it). Default 50
# = the historical 100x100 arena. The load generator's "spread" profile
# pairs a large value here (e.g. 1000 = a 2000x2000 "wide map") with the
# same value in its clients so spawn points and targets live on the same
# map. Note: for visibility = "pvs" the VISIBILITY map stays the
# hand-authored 100x100 sectors regardless (off-map spawns land in the
# SECTOR_OUT catch-all and see only themselves).
#spawn_half_size = 50.0

# Disconnect-park grace of the demo rooms, in seconds (docs/RECONNECT.md
# §3): when a client's transport dies WITHOUT a leave, the player's
# entity STAYS in the world for this long — visible to everyone in the
# next snapshot, holding its room-cap slot, its last move target still
# running. A human who reconnects with the SAME identity inside the
# window (auth name, or ticket player) resumes onto the LIVE entity and
# gets back the same wire id — no despawn/respawn happened at all.
# When the grace runs out, the entity is handed to the demo stub bot
# (ExpireTo::AiHandover): it keeps playing through the ordinary input
# path (a synthesized wander MOVE_TO about once a second), so teammates
# see a hero that wanders instead of one that vanished.
#
# Default 30. 0 restores the pre-reconnect semantics exactly: disconnect
# = instant despawn.
#disconnect_grace_secs = 30.0

# HTTP ops surface (docs/OPS.md): GET /healthz (liveness from the age of
# the latest metrics report), GET /metrics (Prometheus text exposition,
# version 0.0.4), GET /rooms, and the room-admin writes
# POST /rooms/open?id=&tick_hz= and POST /rooms/close?id=. Empty string
# (the default) disables the listener entirely — the default deployment
# gains no extra socket.
#
# SECURITY POSTURE: keep this on loopback. v1 ships no auth and no TLS
# (OPS §5), so anything that can reach the port can scrape metrics AND
# open/close rooms. Bind "127.0.0.1:9090" for local operation; exposing it
# beyond localhost is an explicit decision that needs a network-level
# guard (firewall/ACL), not just good intentions.
#http_listen = "127.0.0.1:9090"

# ── Oda başına override'lar: [rooms.<id>] (docs/OPS.md §2, B18) ────────
# Bir oda (kalabalık bir oda, bir lobi) yukarıdaki ODA DÜZEYİ anahtarlardan
# kendi değerlerini alabilir: tick_hz, room_control, conn_action,
# max_snapshot_bytes, keepalive_hz, max_players, max_idle_input_secs,
# afk_action, max_detach_hold_secs, input_rate_hz, input_burst — aynı
# yazım, aynı anlam (max_players = 0 sınırsız, max_detach_hold_secs =
# "off" tavansız, input_rate_hz = 0 sınırsız). Yazılmayan anahtar sunucunun değerinde
# kalır; bölümü olmayan oda sunucunun odasıdır.
#
# Id, room_count'un ötesinde de olabilir: o zaman runtime'da
# POST /rooms/open?id=<id> ile açılan oda bu değerleri alır (query'deki
# tick_hz bunun da üstündedir). Başlatmayı durdurur: başka bir anahtar
# (bind, max_connections, bir oyunun ayarı — onlar oyunun tablosunda),
# pozitif düz tam sayı olmayan id ([rooms.0], [rooms.07]), global
# tick_hz'i bölmeyen tick_hz, odanın tick_hz'inden büyük keepalive_hz.
# Tablo olduğu için düz anahtarlardan SONRA gelir.
#[rooms.2]
#max_players = 2000
#tick_hz = 10.0

# ── Metrik dışa açımı: [metrics.otlp] (docs/OPS.md §6) ─────────────────
# Raporları her aralıkta bir OpenTelemetry collector'ına OTLP/HTTP
# protobuf olarak iter (POST; yol boşsa /v1/metrics, port yoksa 80).
# Yalnız düz http: https:// başlatmayı durdurur — sunucunun yanında bir
# collector/agent çalıştırın, TLS'i o taşısın. Bu tablo yalnız `otlp`
# cargo feature'ıyla derlenmiş sunucuda çalışır (varsayılan derlemede
# yok); feature'sız derlemede tablo başlatmayı adıyla durdurur, sessizce
# yok sayılmaz. Log satırları ve /metrics (Prometheus) bundan
# etkilenmez. Tablo olduğu için düz anahtarlardan SONRA gelir.
#[metrics.otlp]
#endpoint = "http://127.0.0.1:4318/v1/metrics"
#interval_secs = 10
#service_name = "gsb"

# ── Hosted games' own tables ──────────────────────────────────────────
# game = "arena", game = "mmo" and game = "war" read ONLY the table named
# after them (a
# table is ignored by every other game, so one file may carry several).
# Inside it an unknown key refuses startup, and so does any of these flat
# keys written above, which those games fix: visibility, topology,
# communication, shard_count, aoi_cell_size, team_vision_radius,
# spawn_half_size and disconnect_grace_secs (the demo's; each game names
# its own below). This file writes the demo's keys COMMENTED OUT, at
# their defaults, so a copy switches games by its `game` line alone;
# uncomment one only for the demo. Keep the tables LAST: in TOML every
# key after a [table] header belongs to it.

# game = "arena" — one room with 3D team fog of war (single × team ×
# delta; vision radius 15 m, the arena's own).
#[arena]
# Teams per room (1..=255); joiners are dealt round-robin.
#teams = 3
# How long a dropped player's unit is held (resumable under the same
# name) before the arena's bot walks it back to its base. 0 = it leaves
# at once.
#disconnect_grace_secs = 30.0

# game = "mmo" — one 2×2 sharded world per room (sharded × spatial ×
# delta; 64 m ground-plane AOI cells). Sessions without a saved
# character start at waystone 0 (shard 0).
#[mmo]
# The logout timer: a dropped character stays in the world this long
# (resumable) and then logs out — never while in combat (it waits for
# the fight to cool down). 0 = log out at once.
#logout_grace_secs = 20.0
# What the logout does: "release" (the character leaves, its slot is
# freed) or "bot" (the logout bot walks it to the nearest waystone,
# where it stays, slot held).
#logout = "release"

# game = "war" ("Cephe") — one 2×2 sharded map per room with team fog of
# war over all of it (sharded × team × delta; three factions, vision
# 60 m on the ground, a tower of every faction in every region). A
# player's faction and spawn come from its saved character; a player
# with none is dealt a faction by a hash of its identity and starts at
# that faction's base.
#[war]
# How long a dropped player's unit is held (resumable under the same
# name) before the war's bot walks it home to its base. 0 = it leaves at
# once.
#disconnect_grace_secs = 30.0
# The most records a shard exports to the registry's team hub per
# faction per tick (its players and towers first, then the enemies they
# see; the rest is cut and counted). 1..=16384.
#team_budget = 1024
