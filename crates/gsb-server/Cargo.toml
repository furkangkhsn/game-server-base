[package]
name = "gsb-server"
description = "gsb composition root: configuration, server bootstrap, and the demo binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "gsb-server"
path = "src/main.rs"

# The load generator drives the demo's wire protocol (its bots are
# per-game from GAME-MODULE G3 on), so it needs the demo compiled in.
[[bin]]
name = "gsb-loadgen"
path = "src/loadgen/main.rs"
required-features = ["game-demo"]

# The example client speaks the demo's protocol too.
[[example]]
name = "client"
required-features = ["game-demo"]

[features]
default = ["game-demo", "game-arena", "game-mmo"]
# One feature per hosted game; the `game` config key picks among the
# compiled-in ones at startup.
game-demo = ["dep:gsb-demo", "dep:gsb-kit"]
# The 3D team arena (`gsb-demo-arena`, docs/GAME-MODULE.md G2).
game-arena = ["dep:gsb-demo-arena", "dep:gsb-kit"]
# The 3D sharded MMO (`gsb-demo-mmo`, docs/GAME-MODULE.md G2).
game-mmo = ["dep:gsb-demo-mmo", "dep:gsb-kit"]

[dependencies]
tokio = { workspace = true }
bytes = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
gsb-core = { workspace = true }
gsb-ecs = { workspace = true }
gsb-net = { workspace = true }
gsb-protocol = { workspace = true }
# The 2D demo, hosted by the `game-demo` feature (docs/GAME-MODULE.md
# §4.2). Without any game feature the library still builds: the
# structural proof that the server core names no game.
gsb-demo = { workspace = true, optional = true }
# The 3D arena and the 3D MMO (features `game-arena`, `game-mmo`), and
# the kit whose room and preset types their factories name (the demo
# feature needs it too: the load generator's client view is the kit's
# reference client, `gsb_kit::client`).
gsb-demo-arena = { workspace = true, optional = true }
gsb-demo-mmo = { workspace = true, optional = true }
gsb-kit = { workspace = true, optional = true }
bevy_ecs = { workspace = true }
# TLS client side (example client + loadgen --tls-ca) and server config.
rustls = { workspace = true }
tokio-rustls = { workspace = true }
# PEM loading for the client-side --tls-ca root file.
rustls-pemfile = { workspace = true }

[dev-dependencies]
# Test certificates are minted at runtime (docs/SECURITY.md §2 decision 5):
# no certificate is ever committed to the repository.
rcgen = "0.13"
# QUIC test client for the multi-listener e2e suite: the only honest way
# to walk the server's "quic" door is a real quinn endpoint (the same
# crate the server side speaks; no client helper is exported from
# gsb-net, mirroring how this suite hand-rolls its TLS/WS clients).
quinn = { workspace = true }

[build-dependencies]
gsb-lint = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
