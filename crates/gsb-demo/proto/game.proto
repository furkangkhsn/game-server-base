// Game-specific protocol messages (demo game).
// The Unity counterpart uses Google.Protobuf with this same file.
//
// RETIRED NAMES — do not resurrect them with new meanings. Commit
// 2ac28d2 ("Replace per-connection dirty ledger with per-group full
// world snapshots") deleted three messages when membership became
// "presence in the snapshot":
//   - `EntitySpawned` (fields: entity=1, x=2, y=3) — RENAMED to
//     `EntityRecord`, which still carries those three numbers;
//   - `EntityRemoved` (fields: entity=1) — deleted outright;
//   - `EntityState`   (fields: entity=1, x=2, y=3, version=4) —
//     deleted; `EntityRecord` inside `WorldSnapshot` took over its role
//     WITHOUT the version field (see `EntityRecord`'s `reserved 4`).
// Their opcodes went with them: 1001 (ENTITY_SPAWNED) and 1002
// (ENTITY_REMOVED) are retired and must stay unused — see
// `gsb-demo/src/op.rs`, which is where the opcode space is declared and
// where a test locks them out of the message table. (1003 was reused in
// that same commit: ENTITY_STATE -> WORLD_SNAPSHOT. That reuse is
// history, not precedent — it is exactly the silent recycling these
// notes exist to prevent from happening again.)

syntax = "proto3";

package gsb.game;

// The RPC response envelope (`gsb.base.RpcResponse`, carried in
// `Private.responses` below). BOTH halves of the correlated-request
// envelope are core contracts and live in the base protocol — see that
// file for why, and `docs/DESIGN.md` §5.2 for the ownership rule. A
// Unity (or other) client generated from this file must generate
// `base.proto` alongside it; the wire bytes are unchanged by the import.
import "base.proto";

// The kit's envelope (`gsb.kit`, gsb-kit's `kit.proto`): the kit owns
// the snapshot frame, the private frame and the input ack
// (KIT-ARCHITECTURE §5). `InputAck` is used as is; `WorldSnapshot` and
// `Private` are declared below as this game's TYPED MIRRORS of the
// kit's messages — the same numbers and wire types, with the game's own
// record (`EntityRecord`) and cell-exit (`CellExit`) types in place of
// the kit's opaque `bytes`. A `repeated EntityRecord` and a `repeated
// bytes` under one number encode to identical bytes, so a client decodes
// the kit's frames with these mirrors unchanged; gsb-demo's
// `tests/kit_wire.rs` pins the pairs to identical bytes. A client
// generated from this file must generate `kit.proto` alongside it.
import "kit.proto";

// Client → server: "move my entity toward (x, y)".
message MoveTo {
  // Zig-zag varint: 1 byte for |v| <= 63, 2 for |v| <= 8191, and never
  // more than sfixed32's fixed 4 until |v| > 134M — so it is at least as
  // compact as sfixed32 across every realistic world size.
  sint32 x = 1;
  sint32 y = 2;
  // Client-assigned input sequence number: monotonic from 1 within one
  // session (reset to 1 on every (re)join); 0 = unnumbered (legacy
  // clients — always processed, never advances the server's high-water
  // mark). The server processes an action only when its seq is strictly
  // greater than the last seq it processed for this connection; a
  // duplicate or a reordered/late action is dropped as a normal race of
  // the lossy game band (NOT a protocol violation). The server reports
  // its per-connection high-water mark back in `gsb.kit.InputAck` (carried in
  // the per-connection `Private` frame) — the signal a client's
  // prediction reconciliation needs to know which of its inputs are
  // already applied.
  uint64 seq = 3;
}

// A cell that left a group's view (delta mode only): the client must
// forget every entity it holds for this cell. One record PER CELL, not
// per entity — a 50-entity cell leaving the view costs one record.
message CellExit {
  // Cell index (floor of position / cell_size — the same grid the server
  // buckets entities into; the client knows cell_size from the server
  // configuration and derives each entity's cell from its position).
  sint32 x = 1;
  sint32 y = 2;
}

// Server → client: per-connection frame (opcode PRIVATE = 1004) — the
// typed mirror of `gsb.kit.Private` (its `snapshot` arm is this file's
// typed `WorldSnapshot`; the kit's `bytes game = 4` slot for a game's
// own private payload is not declared: the demo sends none, and a
// decoder skips it). The
// group snapshot (opcode WORLD_SNAPSHOT) is shared by the group's
// members; this frame is addressed to ONE connection. At most one frame
// per tick per connection (the room's private seam), so the payload is
// a oneof of the per-connection message kinds PLUS a repeated RPC
// response list (outside the oneof: a tick that advances the input ack
// AND answers a request ships both, in one frame).
message Private {
  oneof payload {
    // The connection's input high-water mark (see `gsb.kit.InputAck`),
    // sent on the ticks in which it advanced.
    gsb.kit.InputAck ack = 1;
    // A one-shot FULL view snapshot for a connection that just (re)joined
    // a group (or crossed into a new snapshot group): the connection has
    // no baseline for that group's view, and a delta has nothing to apply
    // against. Sent once per join / group crossing; afterwards the group
    // stays in delta mode for everyone (no per-connection groups).
    // CLIENT RULE (the kit's — gsb-kit's `kit.proto`, `Private.snapshot`):
    // a per-connection baseline reset, applied UNCONDITIONALLY.
    WorldSnapshot snapshot = 2;
  }
  // The connection's RPC responses for this tick (empty = none; the
  // frame is then absent or carries only ack/snapshot). Each entry is
  // matched by `gsb.base.RpcResponse.id` to the client's
  // `gsb.base.RpcRequest.id` (see the base protocol for the
  // correlation-space rules and for the envelope's own documentation).
  // A client that receives an `id` it does not recognize (its request
  // was lost and the server answered a retransmission, or it recycled
  // the number) should treat the entry as an answer to the oldest
  // matching pending request or discard it — the id is per-connection,
  // so a foreign entry is impossible by construction.
  //
  // The field number (3) and the LEN wire type are unchanged by the
  // envelope's move from `gsb.game` to `gsb.base`: the AOI one-shot
  // path hand-encodes this tag (gsb-kit's `aoi/logic.rs`, `0x1A`), and
  // `gsb-demo/tests/wire_contract.rs` locks the bytes.
  repeated gsb.base.RpcResponse responses = 3;
}

// Client → server (RPC inner op ABILITY = 1005): "use my ability toward
// (x, y)". The demo's ROOM-LOCAL request kind: the answer is computed in
// the tick that processes the request (no external I/O) and returned in
// the same tick's private frame — the same-tick half of the RPC pattern.
message AbilityUse {
  sint32 x = 1;
  sint32 y = 2;
}

// Server → client: the answer to an AbilityUse request.
message AbilityResult {
  bool ok = 1;
  // Human-readable reason when ok = false (e.g. "out of range").
  string reason = 2;
}

// Client → server (RPC inner op ECONOMY = 1006): "buy item `kind`". The
// demo's EXTERNAL-I/O request kind: the answer requires a round trip to
// the in-process economy service (the reference adapter for delegated
// work — see `gsb_demo::economy`), so the room cannot answer in the
// current tick: it registers the request as pending and the answer
// arrives on a later tick (the server-side request timeout bounds the
// wait).
message BuyItem {
  string kind = 1;
}

// Server → client: the answer to a BuyItem request.
message BuyResult {
  bool ok = 1;
  // Human-readable reason when ok = false (e.g. "unknown item").
  string reason = 2;
  // The price actually charged when ok = true (demo: a fixed price
  // table — there is no wallet in the base).
  uint32 price = 3;
}

// Server → client: one entity inside a WorldSnapshot.
message EntityRecord {
  // Room-assigned wire identity: the n-th entity this room ever assigned
  // an identity to (starts at 1). The value is monotonic and is NEVER
  // re-used within the room's lifetime — even when the ECS allocator
  // recycles the old entity's slot — so identity stays unique even under
  // slot reuse, and the client can tell "the same entity moved" from "a
  // new entity took the slot" from the self-contained snapshots alone
  // (its world view is its last accepted snapshot: an identity in both is
  // the same entity). The room's single counter hands out values at two
  // sites: join (player entities; JOIN_ROOM_RESULT carries the same value
  // to the joiner) and the broadcast pass (every other entity carrying a
  // position — bullets, NPCs, traps — is stamped there, so the
  // broadcast set is exactly "has a position" and no entity is silently
  // invisible). (The old encoding — full bevy entity bits — was unique
  // too, but its low 32 bits are 0xFFFFFFFF - index, so the varint cost 5
  // bytes per record; the serial is 1 byte while the room's identity
  // count stays below 128 and 2 bytes below 16384.)
  uint64 entity = 1;
  // Zig-zag varint (see MoveTo): 1 byte per coordinate over the +/-50
  // arena (|v| <= 50) versus sfixed32's 4 fixed bytes each — measured
  // ~6 B/record smaller for the same content.
  sint32 x = 2;
  sint32 y = 3;

  // Field 4 WAS used on the per-entity record and was removed: it was
  // `uint64 version = 4` on `EntityState`, the message whose role this
  // one took over in commit 2ac28d2 ("Per record, the version field is
  // dropped (21 -> 16 bytes): ordering and staleness are handled by the
  // sequence"). Its source, the `EntityVersion` / `bump()` ECS
  // component, was deleted in the same line of work. Reserved so the
  // number can never come back meaning something else — protoc, not a
  // reviewer, enforces that.
  //
  // ROADMAP contemplates a per-entity version returning for delta
  // broadcast. If it does it takes a FRESH number: reusing 4 for a
  // version with different semantics is precisely what this line
  // forbids, and reusing it for the identical semantics buys nothing
  // (no peer of that vintage is still speaking this protocol — the
  // record's coordinate types changed from sfixed32 to sint32 in
  // 0888441, so those bytes no longer parse anyway).
  reserved 4;
  reserved "version";
}

// Server → client: the snapshot of the room's snapshot group — the
// typed mirror of `gsb.kit.WorldSnapshot` (`entities` typed as the
// demo's `EntityRecord`, `cell_exits` as `CellExit`; the kit writes the
// frame, the demo's codec writes each record body).
//
// FULL mode (`delta` false/absent): the complete, self-contained state of
// the group's view; it replaces the client's entire view. DELTA mode
// (`delta` true): the change since the previous tick (server-side: per
// (group, cell) pair — see `docs/DESIGN.md` §8), applied on top in the
// packet's order: `removed`, then `cell_exits`, then `entities`.
//
// THE CLIENT RULES (baseline, sequence gaps, duplicates, the keep-alive
// convergence guarantee) are the kit's, identical for every kit game,
// and written out once in gsb-kit's `kit.proto` (`gsb.kit.WorldSnapshot`
// and `Private.snapshot`).
message WorldSnapshot {
  // Monotonic snapshot sequence (the room's global tick index). A gap is
  // normal (event-driven stream — see the message docs); a duplicate
  // (<= the last accepted) is discarded. The keep-alive full is the
  // convergence guarantee, not the gap rule.
  uint64 sequence = 1;
  // Entity state: in full mode the complete view; in delta mode the
  // upserts (a wire id here that the client does not hold is a spawn in
  // the client's view).
  repeated EntityRecord entities = 2;
  // DELTA mode only: wire ids that left the group's view this tick
  // (entity exits, reported by the cell that lost the membership — cell
  // local and cheap). Applied before `entities` (see the message docs).
  repeated uint64 removed = 3;
  // DELTA mode only: cells that left the group's view this tick (the
  // client forgets every entity it holds for each of them — one record
  // per cell, whatever the cell's population). Applied after `removed`,
  // before `entities`.
  repeated CellExit cell_exits = 4;
  // true = delta (apply on top, with the client rules above);
  // false/absent = full (replace the entire view). The modes are
  // distinguishable on the wire so a client expecting one mode can
  // detect the other and act instead of silently misapplying it.
  bool delta = 5;
}
