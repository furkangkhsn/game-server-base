[package]
name = "gsb-demo"
description = "Example game for gsb-kit: the 2D demo game (components, movement, wire protocol) running on the kit's rooms."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
gsb-core = { workspace = true }
gsb-ecs = { workspace = true }
gsb-protocol = { workspace = true }
bevy_ecs = { workspace = true }
prost = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
# The economy service (the RPC pattern's external-I/O reference adapter,
# see `src/economy.rs`) runs a tokio task + a bounded channel.
tokio = { workspace = true }

[build-dependencies]
gsb-lint = { workspace = true }
prost-build = { workspace = true }
protoc-bin-vendored = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
