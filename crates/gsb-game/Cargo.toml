[package]
name = "gsb-game"
description = "Demo game logic for gsb: components, movement system, and a RoomLogic implementation."
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
gsb-core = { workspace = true }
gsb-ecs = { workspace = true }
gsb-protocol = { workspace = true }
bevy_ecs = { workspace = true }
prost = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
# The economy service (the RPC pattern's external-I/O reference adapter,
# see `src/economy.rs`) runs a tokio task + a bounded channel.
tokio = { workspace = true }

[build-dependencies]
gsb-lint = { workspace = true }
prost-build = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
