// Game-specific protocol messages (demo game).
// The Unity counterpart uses Google.Protobuf with this same file.

syntax = "proto3";

package gsb.game;

// Client → server: "move my entity toward (x, y)".
message MoveTo {
  // Zig-zag varint: 1 byte for |v| <= 63, 2 for |v| <= 8191, and never
  // more than sfixed32's fixed 4 until |v| > 134M — so it is at least as
  // compact as sfixed32 across every realistic world size.
  sint32 x = 1;
  sint32 y = 2;
}

// Server → client: one entity inside a WorldSnapshot.
message EntityRecord {
  // Room-assigned wire identity: the n-th entity this room ever assigned
  // an identity to (starts at 1). The value is monotonic and is NEVER
  // re-used within the room's lifetime — even when the ECS allocator
  // recycles the old entity's slot — so identity stays unique even under
  // slot reuse, and the client can tell "the same entity moved" from "a
  // new entity took the slot" from the self-contained snapshots alone
  // (its world view is its last accepted snapshot: an identity in both is
  // the same entity). The room's single counter hands out values at two
  // sites: join (player entities; JOIN_ROOM_RESULT carries the same value
  // to the joiner) and the broadcast pass (every other entity carrying a
  // position — bullets, NPCs, traps — is stamped there, so the
  // broadcast set is exactly "has a position" and no entity is silently
  // invisible). (The old encoding — full bevy entity bits — was unique
  // too, but its low 32 bits are 0xFFFFFFFF - index, so the varint cost 5
  // bytes per record; the serial is 1 byte while the room's identity
  // count stays below 128 and 2 bytes below 16384.)
  uint64 entity = 1;
  // Zig-zag varint (see MoveTo): 1 byte per coordinate over the +/-50
  // arena (|v| <= 50) versus sfixed32's 4 fixed bytes each — measured
  // ~6 B/record smaller for the same content.
  sint32 x = 2;
  sint32 y = 3;
}

// Server → client: the complete, self-contained snapshot of the room's
// snapshot group. There is no delta and no history: every snapshot
// replaces the client's entire view of the world. Packet loss is healed
// automatically by the next snapshot. A per-record version field no
// longer exists — ordering is handled by `sequence` and completeness by
// the "no change, no send" rule plus a low-rate keep-alive re-send.
message WorldSnapshot {
  // Monotonic snapshot sequence (the room's global tick index). Clients
  // discard any snapshot whose sequence is <= the last one they accepted.
  uint64 sequence = 1;
  repeated EntityRecord entities = 2;
}
