[package]
name = "gsb-core"
description = "Core actor machinery for gsb: ids, channels, registry, room actor (5-phase tick), connection actor. ECS-agnostic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

# The export layer (`metrics::export`, docs/OPS.md §6): collection is
# always compiled; each way a report leaves the server is a feature.
[features]
default = ["prometheus"]
# The Prometheus text exposition (`MetricReport::render_prometheus`), the
# body of the ops surface's `/metrics`. Pull: rendered at scrape time.
prometheus = []

[dependencies]
tokio = { workspace = true }
gsb-protocol = { workspace = true }
prost = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# `test-util`: the paused-clock tests of the ticker and of a room that
# walks on it (a tick stamp on the runtime's clock flows with it).
tokio = { workspace = true, features = ["test-util"] }

[build-dependencies]
gsb-lint = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
