[package]
name = "gsb-core"
description = "Core actor machinery for gsb: ids, channels, registry, room actor (5-phase tick), connection actor. ECS-agnostic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
tokio = { workspace = true }
gsb-protocol = { workspace = true }
prost = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# `test-util`: the paused-clock tests of the ticker and of a room that
# walks on it (a tick stamp on the runtime's clock flows with it).
tokio = { workspace = true, features = ["test-util"] }

[build-dependencies]
gsb-lint = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
