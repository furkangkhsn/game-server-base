[package]
name = "gsb-net"
description = "Network layer for gsb: pluggable Transport/Listener/Endpoint traits, pump tasks, and the default TCP transport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
crossbeam-channel = { workspace = true }
gsb-core = { workspace = true }
gsb-protocol = { workspace = true }
getrandom = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
# TLS transport (docs/SECURITY.md §2): rustls over the same TCP accept path.
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }

quinn.workspace = true
socket2.workspace = true
sha1.workspace = true

# rUDP record protection core (`seal`, docs/RUDP-SECURITY.md): Noise NK
# via snow + ChaCha20-Poly1305 + HMAC-BLAKE2s, all RustCrypto, no C and
# no `ring`. snow's DEFAULT features pull `ring` (its `std` feature says
# "ring/std"), so default features stay off and only the four primitives
# NK_25519_ChaChaPoly_BLAKE2s needs are named; `risky-raw-split` hands the
# two split keys to our own record layer.
snow = { version = "0.10", default-features = false, features = [
    "use-curve25519",
    "use-chacha20poly1305",
    "use-blake2",
    "use-getrandom",
    "risky-raw-split",
] }
# The same 0.10 line snow uses, so one copy of the cipher is compiled.
chacha20poly1305 = { version = "0.10", default-features = false }
blake2 = { version = "0.10", default-features = false }
hmac = "0.12"
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1", default-features = false }

[dev-dependencies]
# Test certificates are minted at runtime (docs/SECURITY.md §2 decision 5):
# no certificate is ever committed to the repository.
rcgen = "0.13"
# `test-util`: paused-clock tests — the reader pump's idle window (a
# tokio timer, BACKLOG F52) and the rUDP handshake's re-send schedule
# (B86).
tokio = { workspace = true, features = ["test-util"] }

[build-dependencies]
gsb-lint = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
