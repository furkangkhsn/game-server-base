// The well-formed fixture: two gsb services (one error in the same
// package, one fully qualified in another), a reserved op, and an
// ordinary protobuf service the codegen must leave alone.
syntax = "proto3";
package fixture.good;
import "gsb/options.proto";
import "common.proto";

message TransferGold { string to = 1; uint64 amount = 2; }
message TransferDone { uint64 balance = 1; }
message GameError { uint32 code = 1; }
message Craft { uint32 recipe = 1; }
message Crafted { uint32 item = 1; }
message Plain { }

service Game {
  option (gsb.reserved_op) = 1002;
  option (gsb.reserved_op) = 1004;
  rpc Transfer(TransferGold) returns (TransferDone) {
    option (gsb.op) = 1001;
    option (gsb.error) = "GameError";
  }
}

service Workshop {
  rpc Make(Craft) returns (Crafted) {
    option (gsb.op) = 1003;
    option (gsb.error) = ".fixture.common.SharedError";
  }
}

service NotOurs {
  rpc Echo(Plain) returns (Plain);
}
