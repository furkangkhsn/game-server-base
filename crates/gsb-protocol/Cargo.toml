[package]
name = "gsb-protocol"
description = "Wire protocol for gsb: frame envelope, opcodes, and the message registry (protobuf payloads)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"
# Not a native library: `links` is the only cargo mechanism that lets a
# build script publish metadata to its DIRECT dependents. `base.proto`
# now defines messages a game protocol imports (`gsb.base.RpcResponse`),
# so a dependent's build script must be able to find this crate's `proto`
# directory — which it cannot do by a relative path once gsb-protocol
# comes from the registry instead of this workspace. The build script
# emits `cargo:dir=<abs path>`, delivered to dependents as
# `DEP_GSB_BASE_PROTO_DIR`.
links = "gsb-base-proto"

[dependencies]
prost = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
gsb-lint = { path = "../gsb-lint" }
prost-build = { workspace = true }
protoc-bin-vendored = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
