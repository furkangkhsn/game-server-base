// Base (transport-agnostic) protocol messages shared by every gsb server.
// Game-specific messages live in gsb-demo/proto/game.proto (which imports
// this file — see `RpcResponse` and `docs/DESIGN.md` §5.2 for the
// message-ownership rule: core-governed contracts live HERE).
//
// The Unity counterpart uses Google.Protobuf with these same files.
//
// FIELD-NUMBER HISTORY: no field has ever been removed from this file.
// The protocol-hardening round audited the whole history of base.proto
// (`git log -p -- crates/gsb-protocol/proto/base.proto`): every commit
// that touched it (88b0544, 3b9e5e3, 483e3a2, 5c9ac08, f13c6fb) only
// ADDED messages, fields and comments. There is therefore nothing to
// `reserved` here, and no speculative range is declared. When a field IS
// removed, reserve its number AND its name in the same commit, citing
// that commit — see `EntityRecord` in game.proto for the worked example.

syntax = "proto3";

package gsb.base;

message Auth {
  // The local (legacy) identity: used when the server runs WITHOUT a
  // ticket validator (the name is accepted as-is). With a validator
  // configured, `ticket` must be non-empty and the ticket's identity
  // supersedes `name` (the hook is the authority).
  string name = 1;
  // Platform-issued ticket (opaque bytes; the server's ticket-validation
  // hook decides its format). Empty + a configured validator =
  // rejected (ERROR code 10).
  bytes ticket = 2;
  // The wire protocol version this client was built against. There is
  // exactly one version check in the protocol and this is it: no HELLO
  // round trip, no per-frame version byte — the version rides the frame
  // that already has to be first and already has to be refusable.
  //
  //   0  = UNVERSIONED (legacy). Accepted, with a server-side warning.
  //        This is what every client built before the field existed
  //        sends, since proto3 does not encode a default-valued scalar —
  //        which is also why adding this field changed no bytes.
  //   N  = the client speaks version N. Accepted when it equals the
  //        server's version, otherwise rejected with
  //        ERROR_CODE_PROTOCOL_VERSION; the error `message` carries both
  //        numbers so the client knows what to upgrade to.
  //
  // A mismatch is a NORMAL rejection: the connection STAYS ALIVE, the
  // state stays "waiting for auth", and it is never counted against the
  // protocol-violation budget (the frame is well-formed — the client is
  // simply the wrong build). An incompatible client cannot fix the
  // session, but it needs no cleanup path of its own either: the
  // pre-auth frame budget and the idle timeout already bound an
  // unauthenticated connection.
  //
  // The acceptance policy is exact equality, deliberately not a range.
  // See `docs/DESIGN.md` §5.5 for the decision, its rejected
  // alternatives, and the trigger for revisiting it (a second protocol
  // version actually shipping).
  uint32 protocol_version = 3;
  // What this client can READ, as a bit set of `Feature` values (round
  // e1, docs/EVENTS.md §14, §20 E14). Additive — no PROTOCOL_VERSION
  // bump: a client built before the field sends nothing (0), and the
  // server sends it nothing new. A bit set rather than a version because
  // each capability is independent and an older client misparses
  // nothing; PROTOCOL_VERSION moves only for a misparse (DESIGN §5.5).
  // Bits this server does not know are ignored.
  uint64 features = 4;
}

// The bits of `Auth.features`. Each value is a MASK (1, 2, 4 …), not an
// index, so a client ORs the values it supports into the field. proto3
// needs the zero value; it names "no capability".
enum Feature {
  FEATURE_NONE = 0;
  // The client reads PUSH frames (opcode PUSH = 17, message `Push`).
  // Without it the server never sends one: the event's CLIENT leg is
  // counted as unsupported for that connection (docs/EVENTS.md §14).
  FEATURE_PUSH = 1;
}

message AuthResult {
  bool ok = 1;
  string reason = 2;
  // Ticket-auth only (empty on the local-auth path): the player identity
  // the validator extracted from the ticket (the hook is the authority,
  // it supersedes `Auth.name`).
  string player = 3;
  // Ticket-auth only (0 on the local-auth path): the room id the ticket
  // pins; a later JOIN_ROOM_REQ naming a different room is rejected with
  // ERROR code 11 (the connection stays alive and may join the pinned
  // room).
  uint64 room = 4;
}

message JoinRoom {
  uint64 room_id = 1;
}

message JoinRoomResult {
  uint64 entity = 1;
}

message LeaveRoom {}

message LeaveRoomResult {}

message Heartbeat {
  uint64 tick = 1;
}

message HeartbeatAck {
  uint64 tick = 1;
}

// The classes of server error. Every number here was a line in a comment
// table above `Error` until the protocol-hardening round; it is now a
// real enum so the numbering is machine-checked and generated for every
// client language instead of being re-typed by hand on each side. The
// numeric meanings are UNCHANGED — 1..12 mean exactly what the old table
// said — and the field's wire type is unchanged too (a proto3 enum is a
// varint, like the `uint32` it replaces, and identical byte-for-byte over
// this range).
//
// FORWARD COMPATIBILITY — the rule a client must implement:
//
//   An UNKNOWN code (a future number this client's generated enum does
//   not have) MUST be treated as ERROR_CODE_OTHER: report the human
//   readable `message` (always populated), do not retry in a loop, and do
//   not guess it onto a known code's decision. Whether the connection
//   survives is NEVER inferred from the code — the transport reports
//   that; only ERROR_CODE_SERVER_CLOSED, ERROR_CODE_ROOM_DESTROYED and
//   ERROR_CODE_SERVER_STOPPING are followed by a close, and a client that
//   trusts the socket handles a future closing code correctly without
//   knowing it (which is exactly how a client older than 14 handles 14).
//
//   ERROR_CODE_UNSPECIFIED (0) exists only because proto3 requires a zero
//   value. A gsb server NEVER sends it: the Rust mappings
//   (`ProtoError::wire_code`, `CoreError::wire_code`) are exhaustive
//   matches that cannot produce it, and a test asserts that. A client
//   that receives 0 treats it exactly like an unknown code (the case is
//   a non-gsb peer or a corrupted frame).
//
//   The server never RECEIVES this message: ERROR is not an inbound
//   base-band opcode, so an `Error` frame sent to a server is answered as
//   ERROR_CODE_UNKNOWN_OPCODE and charged to the violation budget.
//
// Adding a code is additive (a new number, no field change) — see 12,
// added for the RECONNECT round, and 14 — and it is NOT a protocol
// version bump (see `PROTOCOL_VERSION`): the rule above is what makes an
// older client compatible with it.
enum ErrorCode {
  // Never sent. See the forward-compatibility rule above.
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNKNOWN_OPCODE = 1;
  ERROR_CODE_DECODE = 2;
  // Not authenticated, or already authenticated.
  ERROR_CODE_AUTH = 3;
  // Room operation failed (room not found / tick rate mismatch / any
  // other room-control rejection the client should read the `message`
  // for). The client decision is "temporary or unknown — may retry".
  ERROR_CODE_ROOM_OP_FAILED = 4;
  ERROR_CODE_ROOM_DESTROYED = 5;
  ERROR_CODE_NOT_IN_ROOM = 6;
  ERROR_CODE_OTHER = 7;
  // Gentle reject — the connection STAYS ALIVE; join another room or
  // retry later.
  ERROR_CODE_ROOM_FULL = 8;
  // The server ended THIS session on its own initiative: idle timeout,
  // write stall, connection capacity, the protocol-violation or pre-auth
  // frame budget exhausted, a newer session for the same player, the
  // transport refusing the byte stream ("stream rejected: …"), the room
  // closing a member that stopped sending game input (the input-idle
  // ceiling under `afk_action = disconnect`, "input idle: …"), the GAME
  // kicking the member ("kicked: <the game's reason>", or "kicked" alone;
  // the game's text is at most 256 bytes) — see the `message` for which.
  // The connection is closed right after this frame. (A server STOP is
  // not a verdict on the session: that is 14.)
  ERROR_CODE_SERVER_CLOSED = 9;
  // The server's ticket validator rejected the presented ticket, or the
  // validation timed out. A NORMAL rejection — the connection STAYS
  // ALIVE and may re-present a fresh ticket; never counted against the
  // protocol-violation budget.
  ERROR_CODE_TICKET_INVALID = 10;
  // A ticket-auth connection tried to join a room other than the one its
  // ticket pins; a normal rejection — join the pinned room.
  ERROR_CODE_ROOM_MISMATCH = 11;
  // The match ended or the persistent room was decommissioned; do not
  // retry — return to the lobby. Deliberately distinct from
  // ERROR_CODE_ROOM_OP_FAILED, whose client decision is "temporary or
  // unknown, may retry": 12 means "definitively over"
  // (docs/RECONNECT.md §8).
  ERROR_CODE_ROOM_RETIRED = 12;
  // The client's `Auth.protocol_version` is not the version this server
  // speaks. A normal rejection — the connection STAYS ALIVE and is not
  // charged to the violation budget — but retrying is pointless: the
  // client must be rebuilt. The `message` names both versions. See
  // `Auth.protocol_version` and `docs/DESIGN.md` §5.5.
  ERROR_CODE_PROTOCOL_VERSION = 13;
  // The server process is stopping (`ServerHandle::stop`): this is not a
  // verdict on the session. The connection is closed right after this
  // frame and nothing on this server survives the stop — a parked entity
  // included, so a resume against this address will not find it.
  // Reconnect later, or elsewhere; retrying immediately in a loop is
  // pointless. Best effort: a client that is not reading, or whose
  // outbound queue is full, may get only the close (docs/DESIGN.md
  // §5.6).
  ERROR_CODE_SERVER_STOPPING = 14;
}

// Server error, sent as a response to the message that caused it (or
// unsolicited when the server closes the session).
message Error {
  // The error class (see `ErrorCode`, and its forward-compatibility rule
  // for codes this client does not know). Proto3 enum fields are OPEN:
  // an unrecognised number is preserved, not dropped, so a client can
  // log the raw value while treating it as ERROR_CODE_OTHER.
  ErrorCode code = 1;
  // Human-readable and client-actionable; always populated. It carries
  // the specificity the code class does not (which
  // ERROR_CODE_SERVER_CLOSED reason fired, which room, which ticket
  // failure).
  string message = 2;
}

// Client → server: correlated request envelope (opcode RPC_REQ = 12,
// see the op module). The client wraps a game-band request (its opcode
// and encoded payload) in this envelope together with a correlation id.
// The room answers on the per-connection private frame path
// (`Private.responses`, a game-protocol frame) — never with a frame of
// its own, so the response rides the same per-tick, per-connection
// delivery as input acks (bounded, attributed, no extra channel).
//
// `id` is client-assigned and per-connection: monotonic from 1 is the
// well-behaved pattern (the server only needs it to match reply to
// request WITHIN this connection's stream — the correlation space does
// not cross connections). `id = 0` is rejected (it cannot correlate).
// A duplicate `id` that is still PENDING (in flight) is rejected without
// re-processing (a client retrying an in-flight request must not buy a
// double-applied side effect); a duplicate of an already-ANSWERED id
// is indistinguishable from a fresh request that recycled the number
// and is processed (the server keeps no per-connection history beyond
// the pending set — an unbounded "seen ids" table would be a leak).
message RpcRequest {
  uint64 id = 1;
  // The inner (game-band) opcode. `uint32` on the wire (proto3 has no
  // 16-bit integers); the op space is `u16` by protocol contract (the
  // Rust side decodes into a `u32` field and the room hands it to the
  // logic as `u16` after the same range discipline the op registry
  // applies to every opcode).
  uint32 op = 2;
  bytes payload = 3;
}

// Server → client: the answer to one correlated request (see
// `RpcRequest`). `id` echoes the request's correlation id; `op` echoes
// the request's inner opcode (the client may dispatch on it without its
// own request table). `ok` true: `payload` is the response body (the
// encoded message of the response kind paired with `op`). `ok` false:
// `reason` is a human-readable, client-actionable string (normal
// rejection — "no handler", "pending limit", "timed out", the logic's
// own reason; NOT a protocol-violation signal).
//
// THIS MESSAGE HAS NO OPCODE. It never rides a frame of its own: the
// room delivers it inside the per-connection private frame that the GAME
// protocol owns (`gsb.game.Private.responses`, a repeated field), so the
// answer shares the input ack's per-tick, per-connection delivery —
// bounded, attributed, no extra channel. The game protocol imports this
// file to reference it.
//
// It lives HERE, next to `RpcRequest`, because the correlated-request
// contract is a CORE contract: both halves of the envelope, the id
// space, and the duplicate/timeout rules are identical for every game
// crate, and the core (`gsb_core::rpc`) is the authority on all of them.
// A second game crate inherits the envelope instead of re-inventing it.
// The move from `gsb.game` (where the response half used to live, up to
// commit 5f37c85) is an ownership refactor only: protobuf puts no type
// names on the wire, so the field numbers and the encoded bytes are
// unchanged — locked by `gsb-demo/tests/wire_contract.rs`. See
// `docs/DESIGN.md` §5.2.
message RpcResponse {
  uint64 id = 1;
  bool ok = 2;
  // The request's inner opcode (echoed; `uint32` on the wire — see
  // `RpcRequest.op`).
  uint32 op = 3;
  string reason = 4;
  bytes payload = 5;
  // Added in round q3 (docs/SERVICES.md §16), additive — no
  // PROTOCOL_VERSION bump (docs/DESIGN.md §5.2). Meaningful only when
  // `ok` is false: true → `payload` is the request's TYPED game error
  // (the `(gsb.error)` message of its rpc — possibly zero bytes, since a
  // default-valued proto3 message encodes to nothing) and `reason` is
  // empty; false → an engine answer (no handler, timed out, refused,
  // the logic's own `Reject` …) whose text is in `reason`. An old client
  // never reads the field and sees what it always saw: `ok = false`.
  bool game_error = 6;
}

// Server → client, opcode PUSH = 17, on the reliable band (round e1,
// docs/EVENTS.md §14). One event's CLIENT leg, pushed by server code (a
// service, a room, an admin task) to this connection's identity — nobody
// asked for it, so unlike `RpcResponse` it rides a frame of its OWN: no
// room is on its path (a chat line reaches a player in no room).
//
// Sent only when the client's `Auth.features` has FEATURE_PUSH. A client
// never sends it: a PUSH frame from a client is an unknown inbound
// base-band opcode, answered and charged to the violation budget like
// any other.
//
// Delivery is AT MOST ONCE and every loss is counted server-side; the
// numbering lets the client SEE a loss. `seq` counts the CLIENT legs one
// publisher sent to this identity: 1, 2, 3 … in routing order. A number
// is spent when the leg is routed, so a leg lost below the router (a
// full outbound queue, a parked session) shows up as a gap at the next
// push: within one `stream`, a `seq` greater than the publisher's last
// one plus one means that many pushes were lost. The numbers live as
// long as the server's row for this identity (its first authenticated
// session until it goes offline — a resume keeps them); a new row
// numbers from 1 again under a new `stream`, so a client that sees
// `stream` change resets every publisher's counter instead of reading
// the restart as a gap or a stale push.
message Push {
  // Who pushed it (`PublisherId`): 0 is the engine itself, every other
  // number a publisher handle the server's composition root made.
  uint32 publisher = 1;
  // This CLIENT leg's number from `publisher` to this identity within
  // `stream`, from 1.
  uint64 seq = 2;
  // The event's op (game band; one op space with the requests' inner
  // ops). `uint32` on the wire (proto3 has no 16-bit integers); the op
  // space is `u16` by protocol contract, as for `RpcRequest.op`.
  uint32 op = 3;
  // The event's encoded body (the message its op names), encoded once
  // by the publisher and shared by every receiver.
  bytes body = 4;
  // The incarnation of the server's row for this identity that `seq`
  // belongs to (docs/EVENTS.md §20 E5). Never 0 on a sent push.
  uint64 stream = 5;
}
