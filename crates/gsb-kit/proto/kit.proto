// The kit's own envelope (KIT-ARCHITECTURE §5): the snapshot frame, the
// per-connection private frame and the input acknowledgment every kit
// room writes, whatever the game.
//
// The kit decides WHO sees WHAT and WHEN; the game decides what the
// bytes are. So the envelope carries the game's bytes opaquely: an
// entity record (`WorldSnapshot.entities`) is the body the game's
// `RecordCodec::encode` wrote, a cell exit (`cell_exits`) is the body
// the game's `CellSpace::encode_cell` wrote.
//
// TYPED MIRRORS. Protobuf puts no type names on the wire, and a
// `repeated bytes` field encodes to exactly the same bytes as a
// `repeated <Message>` field under the same number (both are
// length-delimited). A game's own .proto therefore declares a typed
// mirror of these messages — `repeated EntityRecord entities = 2;`
// instead of `repeated bytes entities = 2;` — and its clients decode
// the kit's frames with it unchanged. The demo game's `game.proto` is
// the first such mirror; `gsb-demo`'s wire-contract tests pin the two
// definitions to identical bytes. A mirror must keep every number and
// wire type below; it may leave out a field it never uses (a decoder
// skips an unknown field).
//
// The kit writes `WorldSnapshot` and the `Private.snapshot` arm BY HAND
// (pre-encoded, shared pieces — see `gsb-kit/src/common/frame.rs`); the
// tags hand-written there are pinned against this file by the kit's
// tests.
//
// A client generated from this file must generate `base.proto`
// alongside it (`gsb.base.RpcResponse`).

syntax = "proto3";

package gsb.kit;

import "base.proto";

// Server → client: input acknowledgment. Per connection — carried in the
// `Private` frame, never in the group snapshot (the snapshot is shared
// by the group's members; the ack is not).
message InputAck {
  // The highest input sequence this connection has processed so far
  // (high-water mark; monotonic; reset with the connection's session on
  // (re)join). "Up to N" is a high-water mark, not a contiguity claim:
  // gaps from loss on the loss-tolerant game band do not stop the mark
  // from advancing — a client that needs lossless input rides the
  // transport's reliable band. The mark never exceeds the highest seq
  // actually processed, and it never regresses.
  uint64 processed_up_to = 1;
}

// Server → client: the snapshot of the room's snapshot group (the
// game's snapshot opcode, `Game::SNAPSHOT_OP`).
//
// THE CLIENT RULES below are the kit's and hold for every game: a
// game's typed mirror points here instead of restating them.
//
// FULL mode (`delta` false/absent): the complete, self-contained state
// of the group's view; it replaces the client's entire view. Packet loss
// is healed by the next full. The open, PVS and plain sharded rooms —
// and the team-fog room by default — send full frames only; the AOI and
// sharded × spatial rooms, and the team-fog room in its delta mode (a
// game's opt-in: `TeamRoom::with_delta`), send a full when a group is
// fresh and on the keep-alive cadence, deltas otherwise.
//
// DELTA mode (`delta` true): the change of the group's view since the
// group's PREVIOUS frame (server-side: per cell in the spatial rooms,
// per team in the team-fog room), applied ON TOP of the client's current
// view. The application order is fixed by the packet layout: `removed`
// (entity exits) first, then `cell_exits`, then `entities` (upserts) —
// so an entity that moved between two cells the client sees is exited
// from its source before it is updated in its target, and a client that
// sees only one of the two cells sees exactly the exit or exactly the
// update (both correct for it). The team-fog room's deltas carry no
// `cell_exits` (a vision set is not a union of cells the client could
// compute): an entity that left the team's vision is a `removed` id.
//
// CLIENT RULES (delta mode):
// - a delta WITHOUT a baseline (a fresh connection that has not applied
//  a full yet) is DROPPED until the next full — the server ships a
//  one-shot full via `Private` to every fresh group member (same batch)
//  and a full on the keep-alive cadence;
// - a delta WITH a baseline is applied on top, even across a sequence
//  gap: the records are absolute (upserts of current values, forgets by
//  absolute wire id, forgets by absolute cell) and idempotent, so
//  applying them over a stale view is safe. A sequence gap in the
//  group's stream is NORMAL, not proof of loss — the stream is
//  event-driven (a group ships a frame only when its content changes,
//  and even a moving entity is silent for a run of ticks: the game's
//  wire values are quantized while motion is continuous), and it is the
//  client's only signal that some intermediate frames (possibly
//  carrying exits) may be missing. The worst case is a stale view — at
//  most one keep-alive period (a missed exit may ghost briefly) — and
//  the next keep-alive full restores exact state;
// - a duplicate (sequence <= the last accepted) is discarded.
//
// CONVERGENCE GUARANTEE: every delta group ships a FRESH full snapshot
// on the keep-alive cadence (active or silent), so any client — however
// many deltas it missed — holds the exact group view within one
// keep-alive period, with no out-of-band resync request.
message WorldSnapshot {
  // Monotonic snapshot sequence (the room's global tick index). A gap is
  // normal (an event-driven stream — see the message docs); a duplicate
  // (<= the last accepted) is discarded. The keep-alive full is the
  // convergence guarantee, not the gap rule.
  uint64 sequence = 1;
  // Entity records: in full mode the complete view, in delta mode the
  // upserts. Each entry is one record BODY written by the game's
  // `RecordCodec::encode` (the demo: an `EntityRecord`).
  repeated bytes entities = 2;
  // DELTA mode only: wire ids that left the group's view since its
  // previous frame (a despawn, a cell exit of a single entity, a unit
  // leaving a team's vision). The kit writes them UNPACKED (one `0x18` tag per id); a generated encoder
  // writes proto3's default packed form. Every protobuf parser accepts
  // both encodings of a repeated scalar, so the two decode identically.
  repeated uint64 removed = 3;
  // DELTA mode only (the spatial rooms; the team-fog room never writes
  // it): cells that left the group's view this tick (the
  // client forgets every entity it holds whose record lies in that cell
  // — it derives an entity's cell from the record's wire value the way
  // the game's cell space does; one record per cell, whatever the
  // cell's population). Each entry is one cell BODY written by the
  // game's `CellSpace::encode_cell` (the kit's `Grid2` preset and the
  // demo: a `CellExit { sint32 x = 1; sint32 y = 2; }`).
  repeated bytes cell_exits = 4;
  // true = delta (apply on top, with the client rules above);
  // false/absent = full (replace the entire view). The modes are
  // distinguishable on the wire so a client expecting one mode can
  // detect the other and act instead of silently misapplying it.
  bool delta = 5;
}

// Server → client: the per-connection frame (the game's private opcode,
// `Game::PRIVATE_OP`). At most one per tick per connection.
message Private {
  oneof payload {
    // The connection's input high-water mark, on the ticks it advanced.
    InputAck ack = 1;
    // A one-shot FULL view for a connection that just (re)joined a group,
    // resumed, crossed into a new one or migrated to a new shard (the AOI
    // and sharded × spatial rooms; the team-fog room in delta mode: a
    // join into a team already playing, a resume, a runtime team
    // change). The kit hand-encodes this arm's tag (0x12).
    //
    // CLIENT RULE: this snapshot is a per-connection baseline reset — it
    // is applied UNCONDITIONALLY (it replaces the client's entire view
    // and adopts its `sequence`), regardless of the group stream's last
    // accepted sequence: it is a different stream from the group frames
    // (which share the group's sequence logic), and on a crossing tick it
    // arrives in the same batch right after the new group's delta (which
    // a client without a baseline for the new group drops as a gap — the
    // one-shot full is what establishes the baseline, within the same
    // batch, before the next delta can arrive). It is always `delta =
    // false`; a `true` flag here is a protocol error.
    WorldSnapshot snapshot = 2;
  }
  // The connection's RPC responses for this tick (see `base.proto` for
  // the correlation rules). The kit hand-encodes this field's tag (0x1A)
  // on the same paths.
  repeated gsb.base.RpcResponse responses = 3;
  // The game's own per-connection payload (KIT-ARCHITECTURE §5): opaque
  // to the kit, typed by the game's mirror as its own message under this
  // number. Number 4 was never used in this message (nor in the demo's
  // `gsb.game.Private` it was split from).
  //
  // Written once per SESSION — on the connection's first private frame
  // after a join or a resume (not after a shard migration: the session
  // continues) — and only by a game that has one (`Game::session_private`;
  // the arena: the joiner's team). It rides whatever else that frame
  // carries (an ack, the one-shot full, responses). Absent = the game
  // sent none; present with an empty body = a payload whose fields are
  // all defaults. The kit hand-encodes this field's tag (0x22) last in
  // the frame.
  bytes game = 4;
}
