[workspace]
resolver = "2"
members = [
    "crates/gsb-lint",
    "crates/gsb-protocol",
    "crates/gsb-ecs",
    "crates/gsb-core",
    "crates/gsb-net",
    "crates/gsb-client",
    "crates/gsb-kit",
    "crates/gsb-demo",
    "crates/gsb-demo-arena",
    "crates/gsb-demo-mmo",
    "crates/gsb-demo-war",
    "crates/gsb-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
# MSRV == the pinned toolchain (rust-toolchain.toml): bevy_ecs 0.19.1
# declares rust-version 1.95.0, and 1.94.1 refuses to build the lockfile.
rust-version = "1.95.0"

[workspace.dependencies]
# internal crates
gsb-lint = { path = "crates/gsb-lint" }
gsb-protocol = { path = "crates/gsb-protocol" }
gsb-ecs = { path = "crates/gsb-ecs" }
gsb-core = { path = "crates/gsb-core" }
gsb-net = { path = "crates/gsb-net" }
gsb-client = { path = "crates/gsb-client" }
gsb-kit = { path = "crates/gsb-kit" }
gsb-demo = { path = "crates/gsb-demo" }
gsb-demo-arena = { path = "crates/gsb-demo-arena" }
gsb-demo-mmo = { path = "crates/gsb-demo-mmo" }
gsb-demo-war = { path = "crates/gsb-demo-war" }
gsb-server = { path = "crates/gsb-server" }

# async runtime
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "io-std",
    "sync",
    "time",
    "signal",
    # gsb-loadgen's orchestrator mode spawns and watches child processes
    # (the separate-process load mode).
    "process",
] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["codec", "io"] }
# crossbeam-channel: the rUDP endpoint stream (a &self-friendly channel
# receiver — see crates/gsb-net/src/udp.rs for why the tokio mpsc does not
# fit the Listener trait shape).
crossbeam-channel = "0.5"

# TLS (docs/SECURITY.md §2, Tur A): rustls over TCP. The `ring` provider is
# pinned (not the aws-lc-rs default) so the build stays a pure `cc` compile
# with no cmake/NASM requirement — the workspace's dependency discipline.
rustls = { version = "0.23", default-features = false, features = [
    "logging",
    "std",
    "tls12",
    "ring",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "tls12",
    "ring",
] }
# PEM (cert chain / private key) loading for the server's tls_cert/tls_key
# config paths.
rustls-pemfile = "2"

# ecs
bevy_ecs = "0.19"

# serialization / protocol
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
bytes = "1"

# QUIC transport (Tur: DISTRIBUTED/ROADMAP quinn round)
quinn = "0.11"
# WebSocket handshake accept-key (ws transport; yalnız protokol zorunluluğu)
sha1 = "0.10"

# OS entropy (rUDP cookie key): the getrandom(2)/BCryptGenRandom reader.
# Not a crypto layer — 16 bytes of uniform material is all the key needs.
getrandom = "0.4"

# config / errors / logging
serde = { version = "1", features = ["derive"] }
toml = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
