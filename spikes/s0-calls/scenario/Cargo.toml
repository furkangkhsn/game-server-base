# The spike's tests: one scenario written for bevy_ecs, hecs and no ECS.
# A separate crate so the core has no ECS dependency even in dev builds.
[package]
name = "s0-calls-scenario"
version = "0.0.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
publish = false

[dependencies]
s0-calls = { path = ".." }
s0-calls-bevy-ecs = { path = "../adapters/bevy-ecs" }
s0-calls-hecs = { path = "../adapters/hecs" }
tokio = { version = "1", default-features = false, features = ["sync", "rt", "rt-multi-thread", "time"] }
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }
bevy_ecs = "0.19"
hecs = "0.10"

[build-dependencies]
gsb-lint = { path = "../../../crates/gsb-lint" }
