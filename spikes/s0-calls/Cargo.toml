# Round s0b design spike (docs/SERVICES.md): NOT a member of the gsb
# workspace (the root Cargo.toml lists it under `exclude`); it is its own
# small workspace (see `[workspace]` below). It models a synchronous tick on
# its own types and changes no engine behaviour. This core crate has NO ECS
# dependency; bevy_ecs/hecs live in the optional adapter crates.
[package]
name = "s0-calls"
version = "0.0.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
publish = false

[workspace]
# The core (this crate, NO ECS dependency), its proc-macro, the optional
# ECS adapters, and the scenario crate that holds the tests.
members = [".", "macros", "adapters/bevy-ecs", "adapters/hecs", "scenario"]

[dependencies]
s0-calls-macros = { path = "macros" }
# Channels (try_send / try_recv need no runtime) for the tick side; the
# runtime + timers only for the live service host.
tokio = { version = "1", default-features = false, features = ["sync", "rt", "rt-multi-thread", "time"] }
# The service side runs on tower: the macro's router is a tower::Service,
# the host stacks the game's layers (timeout, concurrency_limit, load_shed).
tower = { version = "0.5", default-features = false, features = ["timeout", "limit", "load-shed", "util"] }
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }

[build-dependencies]
gsb-lint = { path = "../../crates/gsb-lint" }
