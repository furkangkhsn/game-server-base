# The proof rig: one scripted world run through every binding (and
# through a verbatim copy of today's bevy-native kit path), the
# equality tests, and the benchmark binary (`cargo run --release --bin
# bench`). No bench framework: a plain `Instant` loop.
[package]
name = "k0-kit-scenario"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
k0-kit-core = { workspace = true }
k0-kit-bevy-ecs = { workspace = true }
k0-kit-hecs = { workspace = true }
bevy_ecs = { workspace = true }
hecs = { workspace = true }

[build-dependencies]
gsb-lint = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
